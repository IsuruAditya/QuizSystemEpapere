name: Migrate database

# Manual only: Actions → "Migrate database" → Run workflow. Applies pending Prisma migrations to the
# database in the DIRECT_DATABASE_URL repository secret (Neon *direct* connection string, not the
# pooled one). Additive migrations only; never run while students are in a timed exam (deployment.md §5).
on:
  workflow_dispatch:

permissions:
  contents: read

# Never two migrations at once against the same database.
concurrency:
  group: migrate-database
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: "1"
      DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
    steps:
      - name: Require the secret
        run: |
          if [ -z "$DIRECT_DATABASE_URL" ]; then
            echo "::error::Add the repository secret DIRECT_DATABASE_URL (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      # Prisma prints only the host and database name; GitHub masks the secret value in logs.
      - name: Migration status (before)
        run: npx prisma migrate status || true
      - name: Apply pending migrations
        run: npx prisma migrate deploy
      - name: Migration status (after)
        run: npx prisma migrate status
